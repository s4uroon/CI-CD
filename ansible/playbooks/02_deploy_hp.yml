---
# ═══════════════════════════════════════════════════════════════════════════════
# BOUTON 2 SEMAPHORE : Déployer HP
# ═══════════════════════════════════════════════════════════════════════════════
# Cible  : Serveur App Hors-Prod (working tree)
# Action : Le serveur App HP tire le code depuis le Git HP (git fetch + checkout)
#          puis exécute les scripts de déploiement.
#
# Prérequis : Bouton 1 (Synchro Git HP) doit avoir été exécuté.
#
# Flux   :
#   Opérateur
#     --> [Semaphore] clique "Deployer HP"
#     --> Orchestrateur --SSH(Clé B)--> App HP Server
#     --> App HP Server --git fetch(Clé G)--> Git HP Server (bare)
#     --> git checkout + install deps + migrations + reload service
# ═══════════════════════════════════════════════════════════════════════════════

- name: Déploiement applicatif sur Hors-Prod
  hosts: app_hp
  gather_facts: true
  become: false

  pre_tasks:
    - name: Vérifier la connectivité vers App HP
      ansible.builtin.ping:

    - name: Récupérer le commit actuellement en place
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: commit_before
      changed_when: false
      failed_when: false

    - name: Afficher le commit actuel
      ansible.builtin.debug:
        msg:
          - "Déploiement Hors-Prod"
          - "Commit actuel : {{ commit_before.stdout | default('dépôt vide - premier déploiement') }}"
          - "Source git    : {{ git_remote_url }}"

    - name: Créer un tag de sauvegarde avant déploiement
      ansible.builtin.command:
        cmd: >
          git tag -f "backup/hp-pre-deploy-{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':', '-') }}"
        chdir: "{{ app_root }}"
      changed_when: true
      failed_when: false   # Pas bloquant si c'est le premier déploiement

  tasks:
    - name: Synchronisation depuis Git HP (fetch + checkout)
      ansible.builtin.include_role:
        name: git_sync
      vars:
        git_repo_type: working

    - name: Déploiement applicatif (install deps, migrations, reload)
      ansible.builtin.include_role:
        name: deploy
      vars:
        deploy_env: "{{ app_env | default('recette') }}"

  post_tasks:
    - name: Vérifier que le service est actif
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
      register: service_status
      become: true
      become_user: root

    - name: Échouer si le service n'est pas actif
      ansible.builtin.fail:
        msg: "Le service {{ app_service_name }} n'est pas actif après déploiement HP !"
      when: service_status.status.ActiveState != "active"

    - name: Récupérer le commit déployé
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: commit_after
      changed_when: false

    - name: Afficher le résumé du déploiement HP
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "DEPLOIEMENT HORS-PROD TERMINE"
          - "Commit deploye : {{ commit_after.stdout }}"
          - "Service        : {{ app_service_name }} -> ACTIF"
          - "Env            : {{ app_env | default('recette') }}"
          - "================================================"
          - "Prochaine etape : Validation QA, puis Bouton 3 - Synchro Git Prod"
