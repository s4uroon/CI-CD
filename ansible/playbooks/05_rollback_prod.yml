---
# ═══════════════════════════════════════════════════════════════════════════════
# BOUTON 5 SEMAPHORE : Rollback Prod
# ═══════════════════════════════════════════════════════════════════════════════
# Action    : Revient à une version précédente en Production.
# Paramètre : target_version (tag Git, ex: v1.4.2) — saisi dans Semaphore
# Flux      : Orchestrateur --SSH(Clé B)--> Prod (checkout tag + redéploiement)
# ═══════════════════════════════════════════════════════════════════════════════

- name: Rollback Production vers une version antérieure
  hosts: prod
  gather_facts: true
  become: false

  vars:
    # Défini via "Survey Variables" dans le template Semaphore
    # target_version: "v1.4.2"
    deploy_env: "{{ app_env | default('production') }}"

  pre_tasks:
    - name: Vérifier que target_version est défini
      ansible.builtin.fail:
        msg: >
          La variable 'target_version' est obligatoire.
          Définissez-la dans le formulaire Semaphore (ex: v1.3.0).
      when: target_version is not defined or target_version | trim == ""

    - name: Afficher les informations de rollback
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "ROLLBACK PRODUCTION EN COURS"
          - "Version cible : {{ target_version }}"
          - "Serveur       : {{ inventory_hostname }}"
          - "================================================================"

    - name: Vérifier la connectivité vers Prod
      ansible.builtin.ping:

    - name: Récupérer le commit actuel (avant rollback)
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: current_commit
      changed_when: false

    - name: Vérifier que le tag cible existe (local ou distant)
      ansible.builtin.command:
        cmd: git tag -l "{{ target_version }}"
        chdir: "{{ app_root }}"
      register: tag_exists
      changed_when: false

    - name: Fetcher le tag depuis staging si non trouvé localement
      ansible.builtin.command:
        cmd: "git fetch {{ git_remote_name }} 'refs/tags/{{ target_version }}:refs/tags/{{ target_version }}'"
        chdir: "{{ app_root }}"
      when: tag_exists.stdout == ""
      environment:
        GIT_SSH_COMMAND: "ssh -i {{ git_ssh_key_path }} -o StrictHostKeyChecking=accept-new"

    - name: Revérifier l'existence du tag après fetch
      ansible.builtin.command:
        cmd: git tag -l "{{ target_version }}"
        chdir: "{{ app_root }}"
      register: tag_exists_final
      changed_when: false

    - name: Échouer si le tag est introuvable
      ansible.builtin.fail:
        msg: >
          Le tag '{{ target_version }}' est introuvable dans le dépôt local
          et n'a pas pu être récupéré depuis Hors-Prod.
          Vérifiez que ce tag existe sur GitLab et a été propagé vers Hors-Prod.
      when: tag_exists_final.stdout == ""

  tasks:
    - name: Stopper le service applicatif
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
        state: stopped
      become: true
      become_user: root

    - name: Checkout du tag de rollback
      ansible.builtin.command:
        cmd: "git checkout 'tags/{{ target_version }}' --force"
        chdir: "{{ app_root }}"
      register: checkout_result

    - name: Afficher le résultat du checkout
      ansible.builtin.debug:
        var: checkout_result.stdout_lines

    - name: Installer les dépendances de la version rollbackée
      ansible.builtin.include_role:
        name: deploy
        tasks_from: install_deps
      vars:
        deploy_env: "{{ app_env | default('production') }}"

    - name: Appliquer les migrations de rollback (si définies)
      ansible.builtin.include_role:
        name: deploy
        tasks_from: run_migrations_rollback
      when: run_migrations | default(true)

    - name: Redémarrer le service avec la version rollbackée
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
        state: restarted
      become: true
      become_user: root

    - name: Attendre que le service soit stable
      ansible.builtin.pause:
        seconds: 5

    - name: Vérifier que le service est actif
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
      register: service_status
      become: true
      become_user: root
      failed_when: service_status.status.ActiveState != "active"

  post_tasks:
    - name: Récupérer le commit après rollback
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: commit_after_rollback
      changed_when: false

    - name: Afficher le résumé du rollback
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "ROLLBACK PRODUCTION TERMINE AVEC SUCCES"
          - "Version precedente : {{ current_commit.stdout }}"
          - "Version deployee   : {{ target_version }}"
          - "Commit actuel      : {{ commit_after_rollback.stdout }}"
          - "Service            : {{ app_service_name }} -> ACTIF"
          - "================================================================"
