---
# ═══════════════════════════════════════════════════════════════════════════════
# BOUTON 1 SEMAPHORE : Synchro Hors-Prod
# ═══════════════════════════════════════════════════════════════════════════════
# Action : Ordonne à Hors-Prod de fetch/pull le code depuis GitLab Central.
# Flux   : Orchestrateur --SSH(Clé A)--> Hors-Prod --git fetch(Clé D)--> GitLab
# ═══════════════════════════════════════════════════════════════════════════════

- name: Synchronisation Hors-Prod depuis GitLab
  hosts: hors_prod
  gather_facts: false
  become: false

  vars:
    # Peut être surchargé depuis Semaphore "Extra Variables" ou "Survey Variables"
    # Ex: ansible-playbook 01_sync_hors_prod.yml -e "git_branch=feature/ma-branche"
    sync_branch: "{{ git_branch | default('main') }}"
    sync_tag: "{{ git_tag | default('') }}"

  pre_tasks:
    - name: Vérifier la connectivité vers Hors-Prod
      ansible.builtin.ping:

    - name: Afficher les paramètres de synchronisation
      ansible.builtin.debug:
        msg:
          - "Serveur cible  : {{ inventory_hostname }}"
          - "Répertoire app : {{ app_root }}"
          - "Remote Git     : {{ git_remote_name }} -> {{ git_remote_url }}"
          - "Branche/Tag    : {{ sync_tag if sync_tag else sync_branch }}"

  tasks:
    - name: Synchronisation Git depuis GitLab (rôle git_sync)
      ansible.builtin.include_role:
        name: git_sync
      vars:
        target_host_type: hors_prod

  post_tasks:
    - name: Récupérer le commit courant après synchronisation
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: current_commit
      changed_when: false

    - name: Afficher le résumé de synchronisation
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "SYNCHRO HORS-PROD TERMINEE"
          - "Commit deploye : {{ current_commit.stdout }}"
          - "Serveur        : {{ inventory_hostname }}"
          - "Date           : {{ ansible_date_time.iso8601 | default('N/A') }}"
          - "================================================"
