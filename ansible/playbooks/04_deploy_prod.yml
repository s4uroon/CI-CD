---
# ═══════════════════════════════════════════════════════════════════════════════
# BOUTON 4 SEMAPHORE : Déployer Prod
# ═══════════════════════════════════════════════════════════════════════════════
# Cible  : Serveur App Prod (working tree)
# Action : Le serveur App Prod tire le code depuis Git Prod (git fetch + checkout)
#          puis exécute les scripts de déploiement avec sauvegarde BDD préalable.
#
# Prérequis : Boutons 1, 2, 3 (Synchro Git HP, Deploy HP, Synchro Git Prod)
#             validés et QA OK.
#
# Flux   :
#   Opérateur
#     --> [Semaphore] clique "Deployer Prod"
#     --> Orchestrateur --SSH(Clé D)--> App Prod Server
#     --> App Prod Server --git fetch(Clé H)--> Git Prod Server (bare)
#     --> git checkout + sauvegarde BDD + migrations + reload service
# ═══════════════════════════════════════════════════════════════════════════════

- name: Déploiement applicatif en Production
  hosts: app_prod
  gather_facts: true
  become: false

  pre_tasks:
    - name: Vérifier la connectivité vers App Prod
      ansible.builtin.ping:

    - name: Récupérer le commit actuellement en place
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: commit_before
      changed_when: false
      failed_when: false

    - name: Récupérer le tag courant (si existant)
      ansible.builtin.command:
        cmd: git describe --tags --exact-match HEAD
        chdir: "{{ app_root }}"
      register: current_tag
      changed_when: false
      failed_when: false

    - name: Afficher l'état avant déploiement
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOIEMENT EN PRODUCTION"
          - "Commit actuel : {{ commit_before.stdout | default('premier déploiement') }}"
          - "Tag actuel    : {{ current_tag.stdout if current_tag.rc == 0 else 'aucun tag' }}"
          - "Source git    : {{ git_remote_url }}"
          - "================================================================"

    - name: Créer le répertoire de sauvegarde BDD
      ansible.builtin.file:
        path: "{{ db_backup_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"
      become: true
      become_user: root

    - name: Créer un tag Git de sauvegarde avant déploiement
      ansible.builtin.command:
        cmd: >
          git tag -f "backup/prod-pre-deploy-{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':', '-') }}"
        chdir: "{{ app_root }}"
      changed_when: true
      failed_when: false

    - name: Sauvegarde de la base de données avant migration (PostgreSQL)
      ansible.builtin.command:
        cmd: >
          pg_dump -Fc -d {{ db_name }}
          -f {{ db_backup_dir }}/{{ app_name }}_prod_{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}.dump
      when:
        - db_backup_before_migration | default(true)
        - app_type != "static"
      changed_when: true
      environment:
        PGUSER: "{{ db_user }}"
        PGPASSWORD: "{{ db_password | default('') }}"
        PGHOST: "{{ db_host }}"

    - name: Purger les sauvegardes BDD obsolètes
      ansible.builtin.find:
        paths: "{{ db_backup_dir }}"
        patterns: "{{ app_name }}_prod_*.dump"
        age: "{{ db_backup_retention_days | default(30) }}d"
      register: old_backups

    - name: Supprimer les anciennes sauvegardes BDD
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"

  tasks:
    - name: Synchronisation depuis Git Prod (fetch + checkout)
      ansible.builtin.include_role:
        name: git_sync
      vars:
        git_repo_type: working

    - name: Déploiement applicatif Production
      ansible.builtin.include_role:
        name: deploy
      vars:
        deploy_env: "{{ app_env | default('production') }}"

  post_tasks:
    - name: Vérifier que le service est actif
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
      register: service_status
      become: true
      become_user: root

    - name: Échouer si le service n'est pas actif
      ansible.builtin.fail:
        msg: >
          ALERTE : Le service {{ app_service_name }} n'est pas actif !
          Envisagez un rollback immédiat via le Bouton 5.
      when: service_status.status.ActiveState != "active"

    - name: Vérification HTTP de santé (si applicable)
      ansible.builtin.uri:
        url: "http://localhost/health"
        method: GET
        status_code: 200
        timeout: 10
      register: health_check
      failed_when: false
      changed_when: false

    - name: Avertir si le health check échoue
      ansible.builtin.debug:
        msg: "ATTENTION : Health check HTTP a échoué (status {{ health_check.status | default('N/A') }})"
      when: health_check.status is not defined or health_check.status != 200

    - name: Récupérer le commit déployé
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: commit_after
      changed_when: false

    - name: Afficher le résumé du déploiement Production
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "DEPLOIEMENT PRODUCTION TERMINE"
          - "Commit deploye : {{ commit_after.stdout }}"
          - "Service        : {{ app_service_name }} -> ACTIF"
          - "Env            : production"
          - "================================================"
          - "En cas de probleme : Bouton 5 - Rollback Prod"
