---
# ═══════════════════════════════════════════════════════════════════════════════
# BOUTON 4 SEMAPHORE : Déployer Prod
# ═══════════════════════════════════════════════════════════════════════════════
# Prérequis : Playbook 03 (Synchro Prod) doit avoir été exécuté.
# Action    : Exécute les scripts de déploiement en Production
#             (dépendances, sauvegarde BDD, migrations, reload service).
# Flux      : Orchestrateur --SSH(Clé B)--> Prod
# ═══════════════════════════════════════════════════════════════════════════════

- name: Déploiement applicatif en Production
  hosts: prod
  gather_facts: true
  become: false

  pre_tasks:
    - name: Vérifier la connectivité vers Prod
      ansible.builtin.ping:

    - name: Récupérer le commit actuellement en place
      ansible.builtin.command:
        cmd: git log --oneline -1
        chdir: "{{ app_root }}"
      register: commit_before_deploy
      changed_when: false

    - name: Récupérer la version actuelle du tag (si existant)
      ansible.builtin.command:
        cmd: git describe --tags --exact-match HEAD
        chdir: "{{ app_root }}"
      register: current_tag
      changed_when: false
      failed_when: false

    - name: Afficher le commit à déployer en Production
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "DEPLOIEMENT EN PRODUCTION - CONFIRMATION REQUISE"
          - "Commit : {{ commit_before_deploy.stdout }}"
          - "Tag    : {{ current_tag.stdout if current_tag.rc == 0 else 'pas de tag sur ce commit' }}"
          - "App    : {{ app_root }}"
          - "================================================================"

    - name: Créer un répertoire de sauvegarde si inexistant
      ansible.builtin.file:
        path: "{{ db_backup_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"
      become: true
      become_user: root

    - name: Créer un tag Git de sauvegarde avant déploiement
      ansible.builtin.command:
        cmd: >
          git tag -f "backup/prod-pre-deploy-{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':', '-') }}"
        chdir: "{{ app_root }}"
      changed_when: true

    - name: Sauvegarde de la base de données (PostgreSQL)
      ansible.builtin.command:
        cmd: >
          pg_dump -Fc -d {{ db_name }}
          -f {{ db_backup_dir }}/{{ app_name }}_prod_{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}.dump
      when:
        - db_backup_before_migration | default(true)
        - app_type != "static"
      changed_when: true
      environment:
        PGUSER: "{{ db_user }}"
        PGPASSWORD: "{{ db_password | default('') }}"
        PGHOST: "{{ db_host }}"

    - name: Nettoyer les sauvegardes BDD trop anciennes
      ansible.builtin.find:
        paths: "{{ db_backup_dir }}"
        patterns: "{{ app_name }}_prod_*.dump"
        age: "{{ db_backup_retention_days | default(30) }}d"
      register: old_backups

    - name: Supprimer les anciennes sauvegardes
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"

  tasks:
    - name: Déploiement applicatif Production (rôle deploy)
      ansible.builtin.include_role:
        name: deploy
      vars:
        deploy_env: "{{ app_env | default('production') }}"

  post_tasks:
    - name: Vérifier que le service est actif
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
      register: service_status
      become: true
      become_user: root

    - name: Échouer si le service n'est pas actif
      ansible.builtin.fail:
        msg: >
          ALERTE : Le service {{ app_service_name }} n'est pas actif après
          déploiement Production ! Envisagez un rollback immédiat.
      when: service_status.status.ActiveState != "active"

    - name: Vérification HTTP basique (si applicable)
      ansible.builtin.uri:
        url: "http://localhost/health"
        method: GET
        status_code: 200
        timeout: 10
      register: health_check
      failed_when: false
      changed_when: false

    - name: Avertir si le health check échoue
      ansible.builtin.debug:
        msg: "ATTENTION : Health check HTTP a échoué ({{ health_check.status | default('N/A') }}). Vérifiez l'application."
      when: health_check.status is not defined or health_check.status != 200

    - name: Afficher le résumé du déploiement Production
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "DEPLOIEMENT PRODUCTION TERMINE"
          - "Commit  : {{ commit_before_deploy.stdout }}"
          - "Service : {{ app_service_name }} -> {{ service_status.status.ActiveState }}"
          - "Env     : production"
          - "================================================"
          - "En cas de problème : lancer 'Rollback Prod' dans Semaphore"
