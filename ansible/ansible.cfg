[defaults]
# Inventaire par défaut
inventory           = inventory/hosts.yml

# Répertoire des rôles
roles_path          = roles

# Utilisateur SSH de déploiement
remote_user         = deploy

# Désactiver la vérification des known_hosts (géré manuellement avec ssh-keyscan)
host_key_checking   = True

# Activer le logging (utile pour Semaphore)
log_path            = /var/log/ansible/ansible.log

# Performance : parallélisme
forks               = 5

# Timeout SSH
timeout             = 30

# Format de sortie plus lisible dans Semaphore
stdout_callback     = yaml
bin_ansible_callbacks = True

# Désactiver la collecte des facts non utilisés (accélère les playbooks courts)
# Mettre à False si un playbook a besoin de tous les facts système
gathering           = smart
fact_caching        = memory

# Répertoire temporaire sur les cibles
remote_tmp          = /tmp/.ansible/tmp

# Retry files (désactivé pour un environnement propre)
retry_files_enabled = False

[privilege_escalation]
# Élévation de privilèges pour les tâches système (systemd, etc.)
become              = False
become_method       = sudo
become_user         = root
become_ask_pass     = False

[ssh_connection]
# Multiplexage SSH pour accélérer les connexions successives
ssh_args            = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining          = True

# Délai de reconnexion
retries             = 3
