---
# Variables communes — Zone Production
app_user: deploy
app_group: deploy
git_branch: main
git_tag: ""
run_migrations: true
db_backup_before_migration: true
db_backup_dir: /opt/backups
db_backup_retention_days: 30
log_dir: "/var/log/apps"
php_version: "8.2"
composer_path: /usr/local/bin/composer
composer_args: "--no-dev --optimize-autoloader --no-interaction"
php_fpm_service: "php{{ php_version }}-fpm"
python_venv_path: "/opt/apps/.venv"
clear_cache: true
