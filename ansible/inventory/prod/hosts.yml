---
# Inventaire Ansible — Zone Production
# Utilisé par : Semaphore Prod (semaphore-prod.company.com)
# Adapter les IP/hostnames à votre infrastructure

all:
  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ─── Serveur Git+Ansible Prod ─────────────────────────────────────────────
    # Rôle : dépôt bare Git + Ansible installé
    # Semaphore Prod s'y connecte via Clé E
    git_ansible_prod:
      hosts:
        git-ansible-prod.company.com:
          ansible_host: 10.0.2.10
          ansible_ssh_private_key_file: ~/.ssh/id_semaphore_prod  # Clé E

    # ─── Serveurs applicatifs Prod ────────────────────────────────────────────
    # Rôle : exécutent l'application PHP/Python en production
    # Semaphore Prod s'y connecte via Clé G
    # IMPORTANT : cette liste est surchargée dynamiquement par repo
    #             via ansible/repos/<repo_name>.yml → app_servers_prod
    app_prod:
      hosts:
        app1-prod.company.com:
          ansible_host: 10.0.2.21
          ansible_ssh_private_key_file: ~/.ssh/id_semaphore_prod_apps  # Clé G
        # app2-prod.company.com:
        #   ansible_host: 10.0.2.22
        #   ansible_ssh_private_key_file: ~/.ssh/id_semaphore_prod_apps
