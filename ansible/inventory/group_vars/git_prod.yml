---
# ─── Serveur Git Prod ──────────────────────────────────────────────────────────
# Rôle    : Dépôt bare (miroir du Git HP), source pour App Prod
# Bouton  : 3 — Synchro Git Prod
# Réseau  : Zone Production
# ───────────────────────────────────────────────────────────────────────────────

# Type de dépôt Git sur ce serveur
git_repo_type: bare

# Chemin du dépôt bare
git_bare_root: "/opt/git/{{ app_name }}.git"

# Remote : CE SERVEUR se connecte au Git HP pour tirer le code
# C'est le flux principal : Git Prod -> Git HP -> GitLab
git_remote_name: origin
git_remote_url: "deploy@git-hp:/opt/git/{{ app_name }}.git"
# Note : "git-hp" est l'alias défini dans ~/.ssh/config du user deploy
#        sur ce serveur, pointant vers git-hp.company.com avec la Clé F

# Clé SSH utilisée PAR CE SERVEUR pour se connecter au Git HP (Clé F)
git_ssh_key_path: "/home/{{ app_user }}/.ssh/id_gitprod_githp"
