---
# Variables spécifiques au serveur Production

# ─── Git : Prod tire depuis Hors-Prod via SSH ──────────────────────────────────
git_remote_name: staging
git_remote_url: "deploy@hors-prod-git:/opt/apps/myapp"
# Note : "hors-prod-git" est le host alias défini dans ~/.ssh/config sur Prod
# qui pointe vers hors-prod.company.com avec la clé C (id_prod_hp_git)

# Branche ou tag à déployer en production
# En production, on préfère les tags pour des déploiements déterministes
git_branch: main

# ─── SSH config pour git (utilisé dans le rôle git_sync) ──────────────────────
git_ssh_key_path: "/home/{{ app_user }}/.ssh/id_prod_hp_git"

# ─── Application ───────────────────────────────────────────────────────────────
app_env: production
app_debug: false

# ─── Base de données Production ────────────────────────────────────────────────
db_host: "prod-db.company.com"
db_name: "{{ app_name }}_prod"
db_user: "{{ app_name }}_user"
# db_password : à définir dans le Vault Ansible ou les secrets Semaphore

# ─── Rollback ──────────────────────────────────────────────────────────────────
# Répertoire des dumps de sauvegarde avant déploiement
db_backup_dir: /opt/backups
db_backup_retention_days: 30
