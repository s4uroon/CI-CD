---
# ─── Serveur App Hors-Prod ─────────────────────────────────────────────────────
# Rôle    : Serveur applicatif, tire son code depuis le Git HP
# Bouton  : 2 — Déployer HP
# Réseau  : Zone DMZ / Hors-Production
# ───────────────────────────────────────────────────────────────────────────────

# Type de dépôt Git sur ce serveur
git_repo_type: working

# Répertoire de l'application (working tree)
app_root: "/opt/apps/{{ app_name }}"

# Remote : ce serveur tire depuis le Git HP via SSH
git_remote_name: origin
git_remote_url: "deploy@git-hp:/opt/git/{{ app_name }}.git"
# Note : "git-hp" est l'alias défini dans ~/.ssh/config du user deploy
#        sur ce serveur, pointant vers git-hp.company.com avec la Clé G

# Clé SSH utilisée PAR CE SERVEUR pour se connecter au Git HP (Clé G)
git_ssh_key_path: "/home/{{ app_user }}/.ssh/id_apphp_githp"

# ─── Environnement applicatif ──────────────────────────────────────────────────
app_env: recette
app_debug: true

# ─── Base de données Hors-Prod ─────────────────────────────────────────────────
db_host: localhost
db_name: "{{ app_name }}_recette"
db_user: "{{ app_name }}_user"
# db_password : à définir dans Ansible Vault ou les secrets Semaphore
