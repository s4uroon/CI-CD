---
# Variables communes à tous les serveurs (Git et App)
# Surchargées par git_hp.yml, app_hp.yml, git_prod.yml, app_prod.yml

# ─── Application ───────────────────────────────────────────────────────────────
app_name: myapp
app_user: deploy
app_group: deploy

# Répertoire de l'application sur les serveurs App
app_root: "/opt/apps/{{ app_name }}"

# Répertoire du dépôt bare sur les serveurs Git
git_bare_root: "/opt/git/{{ app_name }}.git"

# Type d'application : php | python
app_type: php

# ─── Git ───────────────────────────────────────────────────────────────────────
git_branch: main
git_tag: ""    # Si défini, prend priorité sur git_branch

# ─── PHP ───────────────────────────────────────────────────────────────────────
php_version: "8.2"
composer_path: /usr/local/bin/composer
php_fpm_service: "php{{ php_version }}-fpm"
composer_args: "--no-dev --optimize-autoloader --no-interaction"

# ─── Python ────────────────────────────────────────────────────────────────────
python_venv_path: "{{ app_root }}/.venv"
requirements_file: "{{ app_root }}/requirements.txt"

# ─── Base de données ───────────────────────────────────────────────────────────
run_migrations: true
db_backup_before_migration: true
db_backup_dir: /opt/backups
db_backup_retention_days: 30

# ─── Service systemd ───────────────────────────────────────────────────────────
app_service_name: "{{ app_name }}"

# ─── Logging ───────────────────────────────────────────────────────────────────
log_dir: "/var/log/apps/{{ app_name }}"
