---
# ─── Serveur App Prod ──────────────────────────────────────────────────────────
# Rôle    : Serveur applicatif, tire son code depuis le Git Prod
# Bouton  : 4 — Déployer Prod  |  5 — Rollback Prod
# Réseau  : Zone Production
# ───────────────────────────────────────────────────────────────────────────────

# Type de dépôt Git sur ce serveur
git_repo_type: working

# Répertoire de l'application (working tree)
app_root: "/opt/apps/{{ app_name }}"

# Remote : ce serveur tire depuis le Git Prod via SSH
git_remote_name: origin
git_remote_url: "deploy@git-prod:/opt/git/{{ app_name }}.git"
# Note : "git-prod" est l'alias défini dans ~/.ssh/config du user deploy
#        sur ce serveur, pointant vers git-prod.company.com avec la Clé H

# Clé SSH utilisée PAR CE SERVEUR pour se connecter au Git Prod (Clé H)
git_ssh_key_path: "/home/{{ app_user }}/.ssh/id_appprod_gitprod"

# ─── Environnement applicatif ──────────────────────────────────────────────────
app_env: production
app_debug: false

# ─── Base de données Production ────────────────────────────────────────────────
db_host: prod-db.company.com
db_name: "{{ app_name }}_prod"
db_user: "{{ app_name }}_user"
# db_password : à définir dans Ansible Vault ou les secrets Semaphore
