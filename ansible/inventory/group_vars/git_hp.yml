---
# ─── Serveur Git Hors-Prod ─────────────────────────────────────────────────────
# Rôle    : Dépôt bare (miroir de GitLab), source pour App HP et Git Prod
# Bouton  : 1 — Synchro Git HP
# Réseau  : Zone DMZ / Hors-Production
# ───────────────────────────────────────────────────────────────────────────────

# Type de dépôt Git sur ce serveur
git_repo_type: bare

# Chemin du dépôt bare
git_bare_root: "/opt/git/{{ app_name }}.git"

# Remote : ce serveur tire depuis GitLab Central
git_remote_name: origin
git_remote_url: "git@gitlab:mygroup/{{ app_name }}.git"
# Note : "gitlab" est l'alias défini dans ~/.ssh/config du user deploy
#        sur ce serveur, pointant vers gitlab.company.com avec la Clé E

# Clé SSH utilisée PAR CE SERVEUR pour se connecter à GitLab (Clé E)
git_ssh_key_path: "/home/{{ app_user }}/.ssh/id_githp_gitlab"
