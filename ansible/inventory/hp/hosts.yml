---
# Inventaire Ansible — Zone Hors-Production
# Utilisé par : Semaphore HP (semaphore-hp.company.com)
# Adapter les IP/hostnames à votre infrastructure

all:
  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ─── Serveur Git+Ansible HP ──────────────────────────────────────────────
    # Rôle : dépôt bare Git + Ansible installé
    # Semaphore HP s'y connecte via Clé A
    git_ansible_hp:
      hosts:
        git-ansible-hp.company.com:
          ansible_host: 10.0.1.10
          ansible_ssh_private_key_file: ~/.ssh/id_semaphore_hp   # Clé A

    # ─── Serveurs applicatifs HP ──────────────────────────────────────────────
    # Rôle : exécutent l'application PHP/Python
    # Semaphore HP s'y connecte via Clé C
    # IMPORTANT : cette liste est surchargée dynamiquement par repo
    #             via ansible/repos/<repo_name>.yml → app_servers_hp
    app_hp:
      hosts:
        app1-hp.company.com:
          ansible_host: 10.0.1.21
          ansible_ssh_private_key_file: ~/.ssh/id_semaphore_hp_apps  # Clé C
        # app2-hp.company.com:
        #   ansible_host: 10.0.1.22
        #   ansible_ssh_private_key_file: ~/.ssh/id_semaphore_hp_apps
