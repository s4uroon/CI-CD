---
# Inventaire Ansible — Pipeline de déploiement sécurisé
# Architecture : 4 serveurs cibles distincts (2 Git + 2 App)
# Adapter les adresses IP / noms d'hôtes à votre infrastructure

all:
  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ──────────────────────────────────────────────────────────────────
    # Zone Hors-Production (DMZ / Recette)
    # ──────────────────────────────────────────────────────────────────

    # Serveur Git Hors-Prod : dépôt bare, miroir de GitLab
    # Ansible s'y connecte pour la synchro (Bouton 1)
    git_hp:
      hosts:
        git-hp.company.com:
          ansible_host: 10.0.1.10
          ansible_ssh_private_key_file: ~/.ssh/id_orch_git_hp   # Clé A

    # Serveur App Hors-Prod : application PHP/Python
    # Ansible s'y connecte pour le déploiement (Bouton 2)
    app_hp:
      hosts:
        app-hp.company.com:
          ansible_host: 10.0.1.20
          ansible_ssh_private_key_file: ~/.ssh/id_orch_app_hp   # Clé B

    # ──────────────────────────────────────────────────────────────────
    # Zone Production
    # ──────────────────────────────────────────────────────────────────

    # Serveur Git Prod : dépôt bare, miroir du Git HP
    # Ansible s'y connecte pour la synchro (Bouton 3)
    # Ce serveur se connecte LUI-MEME au Git HP pour le fetch
    git_prod:
      hosts:
        git-prod.company.com:
          ansible_host: 10.0.2.10
          ansible_ssh_private_key_file: ~/.ssh/id_orch_git_prod  # Clé C

    # Serveur App Prod : application PHP/Python
    # Ansible s'y connecte pour le déploiement (Bouton 4 & 5)
    app_prod:
      hosts:
        app-prod.company.com:
          ansible_host: 10.0.2.20
          ansible_ssh_private_key_file: ~/.ssh/id_orch_app_prod  # Clé D

    # ──────────────────────────────────────────────────────────────────
    # Groupes logiques (pour cibler plusieurs serveurs à la fois)
    # ──────────────────────────────────────────────────────────────────
    hors_prod:
      children:
        git_hp:
        app_hp:

    prod_env:
      children:
        git_prod:
        app_prod:
