---
# Inventaire Ansible — Pipeline de déploiement sécurisé
# Adapter les adresses IP / noms d'hôtes à votre infrastructure

all:
  vars:
    # Utilisateur SSH sur les serveurs cibles
    ansible_user: deploy
    # Python sur les serveurs cibles
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ─────────────────────────────────────────
    # Groupe : Serveur Hors-Production (Recette)
    # ─────────────────────────────────────────
    hors_prod:
      hosts:
        hors-prod.company.com:
          ansible_host: 10.0.1.10         # Adapter à votre IP réelle
          ansible_ssh_private_key_file: ~/.ssh/id_orch_hp   # Clé A

    # ─────────────────────────────────────────
    # Groupe : Serveur Production
    # ─────────────────────────────────────────
    prod:
      hosts:
        prod.company.com:
          ansible_host: 10.0.2.10         # Adapter à votre IP réelle
          ansible_ssh_private_key_file: ~/.ssh/id_orch_prod  # Clé B
