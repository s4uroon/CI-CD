---
# Valeurs par défaut du rôle git_sync

# Type de dépôt sur le serveur cible :
#   bare    → dépôt nu (serveurs Git HP et Git Prod), pas de working tree
#   working → dépôt avec working tree (serveurs App HP et App Prod)
git_repo_type: bare

# ─── Chemins ────────────────────────────────────────────────────────────────────
# Utilisé si git_repo_type == bare
git_bare_root: "/opt/git/{{ app_name | default('myapp') }}.git"

# Utilisé si git_repo_type == working
app_root: "/opt/apps/{{ app_name | default('myapp') }}"

# ─── Remote Git ─────────────────────────────────────────────────────────────────
git_remote_name: origin
git_remote_url: ""

# Clé SSH que le serveur CIBLE utilise pour se connecter à sa source
git_ssh_key_path: "~/.ssh/id_git"

# ─── Branche / Tag ──────────────────────────────────────────────────────────────
git_branch: main
git_tag: ""    # Si défini, prend priorité sur git_branch (working tree uniquement)

# ─── Propriétaire ───────────────────────────────────────────────────────────────
app_user: deploy
app_group: deploy

# Créer le dépôt s'il n'existe pas encore
git_init_if_missing: true
