---
# ─── Synchronisation : Working Tree (Serveurs App HP et App Prod) ─────────────
#
# Le serveur App dispose d'un dépôt Git avec working tree actif.
# Il tire le code depuis son serveur Git local (Git HP ou Git Prod).
# Le code est ensuite disponible directement dans app_root pour l'exécution.
#
# Flux d'exécution :
#   Orchestrateur --SSH--> App Server --git fetch--> Git Server (HP ou Prod)
# ─────────────────────────────────────────────────────────────────────────────

# ─── 1. Créer le répertoire de l'application ──────────────────────────────────

- name: "[working] Créer le répertoire de l'application"
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  become: true
  become_user: root

# ─── 2. Cloner depuis le Git Server si absent ─────────────────────────────────

- name: "[working] Vérifier si le dépôt est initialisé"
  ansible.builtin.stat:
    path: "{{ app_root }}/.git"
  register: git_dir

- name: "[working] Cloner depuis le Git Server (premier déploiement)"
  block:
    - name: "[working] Clone initial"
      ansible.builtin.command:
        cmd: >
          git clone
          --origin {{ git_remote_name }}
          --no-checkout
          {{ git_remote_url }}
          {{ app_root }}
      when:
        - not git_dir.stat.exists
        - git_init_if_missing | default(true)
      environment:
        GIT_SSH_COMMAND: "ssh -i {{ git_ssh_key_path }} -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
      register: clone_result

    - name: "[working] [OK] Dépôt initialisé"
      ansible.builtin.debug:
        msg: "  [OK] Dépôt initialisé dans {{ app_root }}"
      when: clone_result is defined and clone_result.changed

  rescue:
    - name: "[working] ERREUR clone initial"
      ansible.builtin.fail:
        msg: |
          ERREUR : Impossible de cloner le dépôt dans {{ app_root }}.
          Source   : {{ git_remote_url }}
          Clé SSH  : {{ git_ssh_key_path }}
          Actions  :
            - Vérifiez que la clé SSH est autorisée sur {{ git_remote_url }}
            - Vérifiez la connectivité réseau vers le serveur Git
            - Vérifiez les permissions sur {{ app_root }}

# ─── 3. Vérifier et corriger l'URL du remote ──────────────────────────────────

- name: "[working] Vérifier l'URL du remote"
  ansible.builtin.command:
    cmd: "git remote get-url {{ git_remote_name }}"
    chdir: "{{ app_root }}"
  register: current_remote_url
  changed_when: false
  failed_when: false

- name: "[working] Ajouter le remote s'il est absent"
  ansible.builtin.command:
    cmd: "git remote add {{ git_remote_name }} {{ git_remote_url }}"
    chdir: "{{ app_root }}"
  when: current_remote_url.rc != 0

- name: "[working] Corriger l'URL du remote si elle a changé"
  ansible.builtin.command:
    cmd: "git remote set-url {{ git_remote_name }} {{ git_remote_url }}"
    chdir: "{{ app_root }}"
  when:
    - current_remote_url.rc == 0
    - current_remote_url.stdout | trim != git_remote_url

# ─── 4. Fetch ─────────────────────────────────────────────────────────────────

- name: "[working] Récupérer le commit avant fetch"
  ansible.builtin.command:
    cmd: git log --oneline -1
    chdir: "{{ app_root }}"
  register: commit_before_working
  changed_when: false
  failed_when: false

- name: "[working] git fetch (branches + tags)"
  block:
    - name: "[working] Exécuter git fetch"
      ansible.builtin.command:
        cmd: "git fetch {{ git_remote_name }} --prune --tags --force"
        chdir: "{{ app_root }}"
      environment:
        GIT_SSH_COMMAND: "ssh -i {{ git_ssh_key_path }} -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
      register: fetch_result

  rescue:
    - name: "[working] ERREUR git fetch"
      ansible.builtin.fail:
        msg: |
          ERREUR : Le fetch depuis {{ git_remote_url }} a échoué sur {{ inventory_hostname }}.
          Clé SSH  : {{ git_ssh_key_path }}
          Détail   : {{ fetch_result.stderr | default('erreur inconnue') }}
          Actions  :
            - Vérifiez que la clé SSH (read-only) est autorisée sur le serveur Git
            - Vérifiez la connectivité réseau entre {{ inventory_hostname }} et le serveur Git
            - Vérifiez que le dépôt bare existe sur le serveur Git

# ─── 5. Déterminer la référence cible ─────────────────────────────────────────

- name: "[working] Définir la référence Git cible"
  ansible.builtin.set_fact:
    git_checkout_ref: >-
      {% if git_tag is defined and git_tag | trim != '' %}tags/{{ git_tag }}
      {% else %}{{ git_remote_name }}/{{ git_branch }}{% endif %}

- name: "[working] Référence cible"
  ansible.builtin.debug:
    msg: "  Checkout vers : {{ git_checkout_ref | trim }}"

# ─── 6. Checkout propre ───────────────────────────────────────────────────────

- name: "[working] Checkout vers la référence cible"
  block:
    - name: "[working] Réinitialiser les modifications locales"
      ansible.builtin.command:
        cmd: git reset --hard HEAD
        chdir: "{{ app_root }}"
      changed_when: false

    - name: "[working] Nettoyer les fichiers non trackés"
      ansible.builtin.command:
        cmd: "git clean -fd --exclude='.env' --exclude='storage/' --exclude='var/'"
        chdir: "{{ app_root }}"
      changed_when: false

    - name: "[working] git checkout"
      ansible.builtin.command:
        cmd: "git checkout --force {{ git_checkout_ref | trim }}"
        chdir: "{{ app_root }}"
      register: checkout_result

  rescue:
    - name: "[working] ERREUR checkout"
      ansible.builtin.fail:
        msg: |
          ERREUR : Le checkout vers {{ git_checkout_ref | trim }} a échoué sur {{ inventory_hostname }}.
          Actions  :
            - Vérifiez que la référence existe dans le dépôt : {{ git_checkout_ref | trim }}
            - Vérifiez que le fetch a bien récupéré les derniers commits
            - Exécutez manuellement : git branch -a dans {{ app_root }}

# ─── 7. Vérification post-checkout ────────────────────────────────────────────

- name: "[working] Récupérer les derniers commits"
  ansible.builtin.command:
    cmd: git log --oneline -3
    chdir: "{{ app_root }}"
  register: git_log
  changed_when: false

- name: "[working] [OK] Code synchronisé"
  ansible.builtin.debug:
    msg:
      - "  [OK] Code synchronisé sur {{ inventory_hostname }}"
      - "  Référence : {{ git_checkout_ref | trim }}"
      - "  Commits récents :"
      - "{{ git_log.stdout_lines }}"

- name: "[working] Corriger les permissions du répertoire"
  ansible.builtin.file:
    path: "{{ app_root }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: false
  become: true
  become_user: root
