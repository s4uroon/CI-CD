---
# ─── Rôle : git_sync — Dispatcher ────────────────────────────────────────────
# Redirige vers la bonne stratégie selon git_repo_type :
#   bare    → sync_bare.yml    (serveurs Git HP et Git Prod)
#   working → sync_working.yml (serveurs App HP et App Prod)
# ─────────────────────────────────────────────────────────────────────────────

- name: Afficher le mode de synchronisation Git
  ansible.builtin.debug:
    msg: "Mode git_sync : {{ git_repo_type }} | Remote : {{ git_remote_name }} -> {{ git_remote_url }}"

- name: Synchronisation dépôt bare (serveur Git)
  ansible.builtin.include_tasks: sync_bare.yml
  when: git_repo_type == "bare"

- name: Synchronisation dépôt working tree (serveur App)
  ansible.builtin.include_tasks: sync_working.yml
  when: git_repo_type == "working"

- name: Échouer si git_repo_type est invalide
  ansible.builtin.fail:
    msg: "git_repo_type doit être 'bare' ou 'working', valeur reçue : '{{ git_repo_type }}'"
  when: git_repo_type not in ['bare', 'working']
